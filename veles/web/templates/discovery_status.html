{% extends "base.html" %}


{% block title %}
Discovery Scan
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/infrastructure.css', v='7') }}"
>

{% endblock %}


{% block content %}

<header class="infra-header">

    <h1>
        🔎 DISCOVERY SCAN
    </h1>

    <p id="scan-message">
        Network discovery running...
    </p>

</header>


<section class="inventory-panel">

    <h2 id="scan-status">
        🟡 STATUS: ACTIVE
    </h2>

    <div id="scanner">

        <div class="orb"></div>

    </div>

    <div id="scan-progress">
        Starting scan...
    </div>

    <div id="scan-found">
        Found: 0
    </div>

</section>


<section
    id="results-panel"
    class="inventory-panel"
    style="display:none;"
>

    <h2>
        🖥 DISCOVERED RESOURCES
    </h2>

    <div
        id="results-list"
        class="resource-list"
    ></div>

</section>


<script>

const scanId = "{{ scan_id }}";

const statusUrl =
    "{{ url_for('discovery_status_data') }}";

const detailsUrl =
    "{{ url_for('discovery_resource_detail') }}";

const importUrl =
    "{{ url_for('import_discovered_resources') }}";


let statusTimer = null;

let scanFinished = false;


/* =========================================================
   STOP SCAN ANIMATION
   ========================================================= */

function stopScanAnimation() {

    const scanner =
        document.getElementById(
            "scanner"
        );


    if (!scanner) {
        return;
    }


    const orb =
        scanner.querySelector(
            ".orb"
        );


    if (orb) {

        orb.style.animation =
            "none";

        orb.style.display =
            "none";

    }


    scanner.style.display =
        "none";

}


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults(results) {

    const panel =
        document.getElementById(
            "results-panel"
        );

    const list =
        document.getElementById(
            "results-list"
        );


    if (!panel || !list) {
        return;
    }


    list.innerHTML = "";


    if (!results || results.length === 0) {

        panel.style.display =
            "block";


        list.innerHTML =
            "<div class=\"empty-state\">" +

            "⚪ NO RESOURCES FOUND" +

            "</div>";


        return;
    }


    panel.style.display =
        "block";


    results.forEach(function(device) {


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "resource-item discovered-resource-item";


        item.dataset.resourceHost =
            device.host || "";


        const services =
            device.services || [];


        let servicesHtml =
            "<div class=\"resource-meta\">" +

            "<div>" +

            "<label>SERVICES</label>";


        if (services.length) {

            services.forEach(
                function(service) {

                    servicesHtml +=
                        "<strong>🟢 " +
                        escapeHtml(
                            service.service ||
                            "Unknown"
                        ) +
                        " : " +
                        escapeHtml(
                            service.port ||
                            "-"
                        );


                    if (
                        service.version
                    ) {

                        servicesHtml +=
                            " — " +
                            escapeHtml(
                                service.version
                            );

                    }


                    servicesHtml +=
                        "</strong>";

                }
            );

        } else {

            servicesHtml +=
                "<strong>" +
                "⚪ NONE DETECTED" +
                "</strong>";

        }


        servicesHtml +=
            "</div>" +

            "</div>";


        /*
         * DETAILS URL
         */

        const host =
            device.host || "";


        const detailsHref =
            detailsUrl +
            "?host=" +
            encodeURIComponent(
                host
            );


        /*
         * RESOURCE JSON
         */

        const resourceJson =
            JSON.stringify(
                device
            );


        /*
         * CARD
         */

        item.innerHTML =

            "<div class=\"resource-icon\">" +

            getDeviceIcon(
                device.type
            ) +

            "</div>" +


            "<div class=\"resource-info\">" +


            "<h2>" +

            escapeHtml(
                device.name ||
                device.host ||
                "Discovered Resource"
            ) +

            "</h2>" +


            /*
             * BASIC META
             */

            "<div class=\"resource-meta\">" +


            "<div>" +

            "<label>STATUS</label>" +

            "<strong>" +

            (
                device.status === "alive"
                    ? "🟢 ALIVE"
                    : "⚪ " +
                      escapeHtml(
                          device.status ||
                          "UNKNOWN"
                      )
            ) +

            "</strong>" +

            "</div>" +


            "<div>" +

            "<label>TYPE</label>" +

            "<strong>" +

            escapeHtml(
                device.type ||
                "unknown"
            ) +

            "</strong>" +

            "</div>" +


            "<div>" +

            "<label>HOST</label>" +

            "<strong>" +

            escapeHtml(
                device.host ||
                "-"
            ) +

            "</strong>" +

            "</div>" +


            "<div>" +

            "<label>PORT</label>" +

            "<strong>" +

            escapeHtml(
                device.port ||
                "-"
            ) +

            "</strong>" +

            "</div>" +


            "</div>" +


            /*
             * IDENTITY
             */

            (
                (
                    device.hostname ||
                    device.mac ||
                    (
                        device.os &&
                        device.os !== "unknown"
                    )
                )

                ?

                "<div class=\"resource-meta\">" +

                (
                    device.hostname
                    ?

                    "<div>" +
                    "<label>HOSTNAME</label>" +
                    "<strong>" +
                    escapeHtml(
                        device.hostname
                    ) +
                    "</strong>" +
                    "</div>"

                    :

                    ""
                ) +

                (
                    device.mac
                    ?

                    "<div>" +
                    "<label>MAC</label>" +
                    "<strong>" +
                    escapeHtml(
                        device.mac
                    ) +
                    "</strong>" +
                    "</div>"

                    :

                    ""
                ) +

                (
                    device.os &&
                    device.os !== "unknown"

                    ?

                    "<div>" +
                    "<label>OS</label>" +
                    "<strong>🖥 " +
                    escapeHtml(
                        device.os
                    ) +
                    "</strong>" +
                    "</div>"

                    :

                    ""
                ) +

                "</div>"

                :

                ""
            ) +


            /*
             * SERVICES
             */

            servicesHtml +


            /*
             * DISCOVERY
             */

            "<div class=\"resource-meta\">" +

            "<div>" +

            "<label>DISCOVERY</label>" +

            "<strong>" +
            "⚡ FAST DISCOVERY" +
            "</strong>" +

            "</div>" +

            "</div>" +


            /*
             * ACTIONS
             */

            "<div class=\"action-row\">" +


            /*
             * DETAILS
             */

            "<button " +

            "type=\"button\" " +

            "class=\"infra-button details-button\" " +

            "data-details-url=\"" +
            detailsHref +
            "\"" +

            ">" +

            "🔎 DETAILS" +

            "</button>" +


            /*
             * ADD RESOURCE
             */

            "<form " +

            "class=\"add-resource-form\" " +

            "method=\"POST\" " +

            "action=\"" +
            importUrl +
            "\"" +

            ">" +


            "<input " +

            "type=\"hidden\" " +

            "name=\"resource\" " +

            "value='" +
            escapeAttribute(
                resourceJson
            ) +
            "'" +

            ">" +


            "<button " +

            "class=\"infra-button add-resource-button\" " +

            "type=\"submit\"" +

            ">" +

            "➕ ADD RESOURCE" +

            "</button>" +


            "</form>" +


            "</div>" +


            "</div>";


        list.appendChild(
            item
        );

    });


    bindResultActions();

}


/* =========================================================
   DEVICE ICON
   ========================================================= */

function getDeviceIcon(type) {

    switch (
        String(
            type || ""
        ).toLowerCase()
    ) {

        case "server":
            return "🖥";

        case "computer":
            return "🖥";

        case "laptop":
            return "💻";

        case "phone":
            return "📱";

        case "tv":
            return "📺";

        case "camera":
            return "📷";

        case "printer":
            return "🖨️";

        case "router":
            return "📡";

        case "network_device":
            return "🌐";

        case "iot":
            return "💡";

        case "container":
            return "🐳";

        case "agent":
            return "🤖";

        case "device":
            return "📡";

        default:
            return "☁";

    }

}


/* =========================================================
   HTML SAFETY
   ========================================================= */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


function escapeAttribute(value) {

    return escapeHtml(
        value
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#39;"
    );

}


/* =========================================================
   ADD RESOURCE AJAX
   ========================================================= */

function bindAddResourceForms() {

    const forms =
        document.querySelectorAll(
            "#results-list .add-resource-form"
        );


    forms.forEach(
        function(form) {

            if (
                form.dataset.ajaxBound ===
                "1"
            ) {
                return;
            }


            form.dataset.ajaxBound =
                "1";


            form.addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const button =
                        form.querySelector(
                            ".add-resource-button"
                        );


                    const resourceItem =
                        form.closest(
                            ".discovered-resource-item"
                        );


                    if (
                        !button ||
                        !resourceItem
                    ) {
                        return;
                    }


                    if (
                        button.disabled
                    ) {
                        return;
                    }


                    button.disabled =
                        true;


                    const originalText =
                        button.innerHTML;


                    button.innerHTML =
                        "⏳ ADDING...";


                    try {

                        const response =
                            await fetch(
                                form.action,
                                {
                                    method:
                                        "POST",

                                    body:
                                        new FormData(
                                            form
                                        ),

                                    credentials:
                                        "same-origin",

                                    headers: {
                                        "X-Requested-With":
                                            "XMLHttpRequest",

                                        "Accept":
                                            "application/json"
                                    },

                                    redirect:
                                        "follow"
                                }
                            );


                        if (
                            !response.ok
                        ) {

                            throw new Error(
                                "HTTP " +
                                response.status
                            );

                        }


                        resourceItem.remove();


                        const list =
                            document.getElementById(
                                "results-list"
                            );


                        if (
                            list &&
                            !list.querySelector(
                                ".discovered-resource-item"
                            )
                        ) {

                            list.innerHTML =
                                "<div class=\"empty-state\">" +

                                "✓ ALL DISCOVERED RESOURCES HAVE BEEN ADDED." +

                                "</div>";

                        }


                    } catch (
                        error
                    ) {

                        console.error(
                            "Failed to add discovered resource:",
                            error
                        );


                        button.disabled =
                            false;


                        button.innerHTML =
                            originalText;


                        alert(
                            "Failed to add resource."
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   DETAILS BUTTONS
   ========================================================= */

function bindDetailsButtons() {

    const buttons =
        document.querySelectorAll(
            "#results-list .details-button"
        );


    buttons.forEach(
        function(button) {

            if (
                button.dataset.detailsBound ===
                "1"
            ) {
                return;
            }


            button.dataset.detailsBound =
                "1";


            button.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();


                    const url =
                        button.dataset.detailsUrl;


                    if (!url) {
                        return;
                    }


                    /*
                     * If the main Discovery page
                     * modal functions are available,
                     * use the same modal without
                     * navigating away.
                     */

                    if (
                        typeof window.openDetails ===
                        "function"
                    ) {

                        window.openDetails(
                            url
                        );

                        return;
                    }


                    /*
                     * Fallback for the scan page.
                     */

                    window.location.href =
                        url;

                }
            );

        }
    );

}


/* =========================================================
   BIND RESULT ACTIONS
   ========================================================= */

function bindResultActions() {

    bindAddResourceForms();

    bindDetailsButtons();

}


/* =========================================================
   STOP COMPLETED SCAN
   ========================================================= */

function finishScan(data) {

    if (scanFinished) {
        return;
    }


    scanFinished =
        true;


    /*
     * STOP POLLING
     */

    if (
        statusTimer !== null
    ) {

        clearInterval(
            statusTimer
        );

        statusTimer =
            null;

    }


    /*
     * STOP VISUAL SCANNER
     */

    stopScanAnimation();


    /*
     * FINAL STATUS
     */

    const status =
        document.getElementById(
            "scan-status"
        );


    const message =
        document.getElementById(
            "scan-message"
        );


    const progress =
        document.getElementById(
            "scan-progress"
        );


    const found =
        document.getElementById(
            "scan-found"
        );


    if (status) {

        status.textContent =
            "🟢 STATUS: COMPLETE";

    }


    if (message) {

        message.textContent =
            "Network discovery completed.";

    }


    if (progress) {

        progress.textContent =
            "Checked: " +
            (data.checked || 0) +
            " / " +
            (data.total || 0);

    }


    if (found) {

        found.textContent =
            "Found: " +
            (data.found || 0);

    }


    /*
     * SHOW FINAL RESULTS
     */

    renderResults(
        data.results || []
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function finishScanWithError(
    errorMessage
) {

    if (statusTimer !== null) {

        clearInterval(
            statusTimer
        );

        statusTimer =
            null;

    }


    stopScanAnimation();


    const status =
        document.getElementById(
            "scan-status"
        );


    const message =
        document.getElementById(
            "scan-message"
        );


    const progress =
        document.getElementById(
            "scan-progress"
        );


    if (status) {

        status.textContent =
            "🔴 STATUS: ERROR";

    }


    if (message) {

        message.textContent =
            "Network discovery failed.";

    }


    if (progress) {

        progress.textContent =
            errorMessage ||
            "Unknown discovery error.";

    }

}


/* =========================================================
   UPDATE SCAN STATUS
   ========================================================= */

function updateScanStatus() {

    /*
     * Do not continue polling after
     * the scan has already completed.
     */

    if (scanFinished) {
        return;
    }


    fetch(
        statusUrl +
        "?scan_id=" +
        encodeURIComponent(
            scanId
        ) +
        "&_=" +
        Date.now(),
        {
            cache:
                "no-store",

            credentials:
                "same-origin"
        }
    )

    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            return response.json();

        }
    )

    .then(
        function(data) {

            if (scanFinished) {
                return;
            }


            const progress =
                document.getElementById(
                    "scan-progress"
                );


            const found =
                document.getElementById(
                    "scan-found"
                );


            const status =
                document.getElementById(
                    "scan-status"
                );


            const message =
                document.getElementById(
                    "scan-message"
                );


            /*
             * BACKEND ERROR
             */

            if (data.error) {

                finishScanWithError(
                    data.error
                );

                return;
            }


            /*
             * UPDATE PROGRESS
             */

            if (progress) {

                progress.textContent =
                    "Checked: " +
                    (data.checked || 0) +
                    " / " +
                    (data.total || 0);

            }


            if (found) {

                found.textContent =
                    "Found: " +
                    (data.found || 0);

            }


            /*
             * RUNNING
             */

            if (
                data.running === true
            ) {

                if (status) {

                    status.textContent =
                        "🟡 STATUS: ACTIVE";

                }


                if (message) {

                    message.textContent =
                        "Network discovery running...";

                }


                return;
            }


            /*
             * IMPORTANT:
             *
             * running === false means
             * backend has finished.
             *
             * Stop spinner immediately.
             */

            finishScan(
                data
            );

        }
    )

    .catch(
        function(error) {

            console.error(
                "Discovery status error:",
                error
            );

        }
    );

}


/* =========================================================
   INITIAL STATUS REQUEST
   ========================================================= */

updateScanStatus();


/* =========================================================
   POLLING
   ========================================================= */

statusTimer =
    setInterval(
        updateScanStatus,
        500
    );


/* =========================================================
   INITIAL RESULT ACTIONS
   ========================================================= */

bindResultActions();

</script>


{% endblock %}
