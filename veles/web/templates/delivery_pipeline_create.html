{% extends "base.html" %}


{% block title %}
Create Pipeline
{% endblock %}


{% block extra_css %}

<style>

    .pipeline-create-header {
        margin-bottom: 30px;
    }

    .pipeline-create-header h1 {
        margin-bottom: 8px;
    }

    .pipeline-create-header p {
        opacity: 0.75;
    }

    .pipeline-create-card {
        max-width: 760px;
        padding: 28px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: inherit;
    }

    .form-group select {
        min-height: 46px;
        cursor: pointer;
    }

    .form-group select option {
        background: var(--panel);
        color: var(--text);
    }

    .form-group textarea {
        min-height: 140px;
        resize: vertical;
    }

    .form-actions {
        display: flex;
        gap: 16px;
        margin-top: 28px;
        flex-wrap: wrap;
    }

    .veles-action {
        font-family: "Segoe UI",
            Arial,
            sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 240px;
        min-width: 240px;
        min-height: 58px;
        height: 58px;
        padding: 0 22px;
        box-sizing: border-box;
        background: var(--panel2);
        border: 2px solid var(--gold);
        border-radius: 10px;
        color: var(--gold2);
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1.3px;
        cursor: pointer;
        transition: .25s ease;
        box-shadow: 0 0 18px rgba(
                217,
                164,
                65,
                .18
            );
        flex: 0 0 auto;
    }

    .veles-action:hover {
        background: var(--panel);
        box-shadow: 0 0 24px rgba(
                217,
                164,
                65,
                .30
            );
        transform: translateY(-1px);
    }

    .veles-action:active {
        transform: translateY(0);
    }

</style>

{% endblock %}


{% block content %}

<header class="pipeline-create-header">

    <h1>
        🚀 CREATE PIPELINE
    </h1>

    <p>
        Create a new delivery pipeline
    </p>

</header>


<section class="pipeline-create-card">

    <form
        method="POST"
        action="{{ url_for('create_delivery_pipeline') }}"
    >

        <div class="form-group">

            <label for="name">
                Pipeline Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                required
                autofocus
                placeholder="Enter pipeline name"
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                placeholder="Enter pipeline description (optional)"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="resource_id">
                Deployment Target
            </label>

            <select
                id="resource_id"
                name="resource_id"
                required
            >

                <option value="">
                    Select a target
                </option>

                {% for target in targets %}

                    <option
                        value="{{ target.id }}"
                        {% if target.id|string == selected_resource_id|string %}selected{% endif %}
                    >
                        {{ target.name }} — {{ target.host }} — {{ target.type }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="veles-action"
            >
                CREATE PIPELINE
            </button>

            <a
                href="{{ url_for('delivery_view') }}"
                class="veles-action"
            >
                CANCEL
            </a>

        </div>

    </form>

</section>

{% endblock %}
