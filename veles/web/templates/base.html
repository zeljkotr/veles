<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
{% block title %}
Veles AI Operations Center
{% endblock %}
</title>


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/veles.css') }}">


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}">


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/logs.css') }}">


<link rel="stylesheet"
      href="{{ url_for('static', filename='css/system.css') }}">


{% block extra_css %}
{% endblock %}


</head>


<body>


<div class="app-layout">



<aside class="sidebar">


<div class="sidebar-brand">

    ◉ VELES

</div>


<div class="sidebar-subtitle">

    AI Operations Center

</div>



<nav class="main-menu">


<a href="{{ url_for('dashboard_view') }}">
    Dashboard
</a>


<a href="{{ url_for('chat') }}">
    AI Console
</a>


<a href="{{ url_for('memory_view') }}">
    Memory
</a>


<a href="{{ url_for('system_view') }}">
    System
</a>


<a href="{{ url_for('logs_view') }}">
    Logs
</a>


</nav>


</aside>




<section class="main-area">


<header class="top-header">


<div class="brand">

    VELES OPERATIONS CENTER

</div>


<div class="brand-status">

    ONLINE • LOCAL AI • OLLAMA

</div>


</header>





<main class="page-container">


{% block content %}

{% endblock %}


</main>



</section>


</div>





<script src="{{ url_for('static', filename='js/veles.js') }}"></script>


<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>


{% block extra_js %}
{% endblock %}


</body>


</html>
