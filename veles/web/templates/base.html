<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>


<title>
{% block title %}
Veles AI Operations Center
{% endblock %}
</title>


<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/veles.css',
        v='3'
    ) }}"
>


<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/dashboard.css',
        v='2'
    ) }}"
>


<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/logs.css',
        v='2'
    ) }}"
>


<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/system.css',
        v='2'
    ) }}"
>


{% block extra_css %}
{% endblock %}


<style>

/* =========================================================
   VELES OS BASE NAVIGATION
   ========================================================= */

.sidebar {

    padding: 28px 22px;

}


.sidebar-brand {

    font-size: 30px;

    font-weight: 800;

    letter-spacing: 2px;

}


.sidebar-subtitle {

    margin-top: 7px;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 1.5px;

}


.main-menu {

    margin-top: 34px;

}


.main-menu-section {

    margin-bottom: 28px;

}


.main-menu-section-title {

    margin-bottom: 12px;

    color: var(--muted);

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

}


.main-menu a {

    display: flex;

    align-items: center;

    min-height: 48px;

    padding: 0 14px;

    margin-bottom: 6px;

    border-radius: 9px;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: .4px;

    text-decoration: none;

}


.main-menu a:hover {

    font-size: 18px;

}


.main-menu-icon {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    width: 28px;

    margin-right: 10px;

    font-size: 21px;

}


/* =========================================================
   TOP HEADER
   ========================================================= */

.brand {

    font-size: 21px;

    font-weight: 800;

    letter-spacing: 2px;

}


.brand-status {

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 1.2px;

}


</style>

</head>


<body>


<div class="app-layout">


<!-- =====================================================
     VELES OS SIDEBAR
     ===================================================== -->

<aside class="sidebar">


<div class="sidebar-brand">
    VELES OPERATING SYSTEM
</div>


<nav class="main-menu">


<!-- WORKSPACE -->

<div class="main-menu-section">

    <div class="main-menu-section-title">
        WORKSPACE
    </div>


    <a href="{{ url_for('dashboard_view') }}">

        <span class="main-menu-icon">
            ◉
        </span>

        Overview

    </a>

</div>


<!-- OPERATIONS -->

<div class="main-menu-section">

    <div class="main-menu-section-title">
        OPERATIONS
    </div>


    <a href="{{ url_for('discovery_page') }}">

        <span class="main-menu-icon">
            ◈
        </span>

        Discovery

    </a>


    <a href="{{ url_for('system_view') }}">

        <span class="main-menu-icon">
            ▣
        </span>

        System

    </a>


    <a href="{{ url_for('logs_view') }}">

        <span class="main-menu-icon">
            ◇
        </span>

        Events

    </a>

</div>


<!-- INTELLIGENCE -->

<div class="main-menu-section">

    <div class="main-menu-section-title">
        INTELLIGENCE
    </div>


    <a href="{{ url_for('chat') }}">

        <span class="main-menu-icon">
            ✦
        </span>

        AI

    </a>


    <a href="{{ url_for('memory_view') }}">

        <span class="main-menu-icon">
            ◎
        </span>

        Memory

    </a>

</div>


</nav>


</aside>


<!-- =====================================================
     MAIN AREA
     ===================================================== -->

<section class="main-area">


<header class="top-header">


<div class="brand">

    VELES OPERATIONS CENTER

</div>


<div class="brand-status">

    ONLINE • LOCAL AI • OLLAMA

</div>


</header>


<main class="page-container">

{% block content %}
{% endblock %}

</main>


</section>


</div>


<script
    src="{{ url_for(
        'static',
        filename='js/veles.js',
        v='2'
    ) }}"
></script>


<script
    src="{{ url_for(
        'static',
        filename='js/dashboard.js',
        v='2'
    ) }}"
></script>


{% block extra_js %}
{% endblock %}


</body>

</html>
