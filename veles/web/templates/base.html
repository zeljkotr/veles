<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Veles{% endblock %}</title>
    <style>
        :root {
            --bg: #12151b;
            --bg-elevated: #1a1e27;
            --border: #2a2f3a;
            --text: #e4e7ec;
            --text-muted: #8b93a7;
            --accent: #e8a33d;
            --fail: #ef5f5f;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
        header { background: var(--bg-elevated); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        header .brand { font-weight: 600; font-family: ui-monospace, monospace; display: inline-flex; align-items: center; gap: 8px; letter-spacing: 0.05em; }
        .brand-icon { flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(232, 163, 61, 0.6)); }
        nav a { color: var(--text-muted); margin-left: 18px; text-decoration: none; font-family: ui-monospace, monospace; font-size: 0.9rem; }
        nav a:hover { color: var(--accent); }
        main { max-width: 800px; margin: 0 auto; padding: 32px 24px; }
        textarea, input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 0.95rem; }
        button { background: var(--accent); border: none; color: #14161c; font-weight: 600; border-radius: 6px; padding: 10px 18px; cursor: pointer; margin-top: 10px; }
        .card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-top: 18px; }
        .muted { color: var(--text-muted); font-size: 0.85rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <span class="brand">
            <svg class="brand-icon" width="22" height="22" viewBox="0 0 22 22">
                <defs>
                    <radialGradient id="brandGradient" cx="35%" cy="35%">
                        <stop offset="0%" stop-color="#ffd48a" />
                        <stop offset="55%" stop-color="#e8a33d" />
                        <stop offset="100%" stop-color="#8a5a1f" />
                    </radialGradient>
                </defs>
                <circle cx="11" cy="11" r="7" fill="url(#brandGradient)" />
            </svg>
            VELES
        </span>
        <nav>
            <a href="{{ url_for('chat') }}">Chat</a>
            <a href="{{ url_for('memory_view') }}">Memorija</a>
            <a href="{{ url_for('logs_view') }}">Logovi</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
